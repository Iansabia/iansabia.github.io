<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Ian Sabia</title>
<!-- The Demos page is now part of Projects. Old links (and the #hash or ?query on them) land there.
     No site scripts load here, so the first-visit intro plays on the Projects page instead. -->
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  (function () {
    // old Demos anchors: the hole and the car game have Projects cards; the other work toys live on the Work page
    var map = { play: 'all', watch: 'from-work', toys: 'from-work', hole: 'continuum', drive: 'nvidia' };
    var work = { ccapp: 'continuum', range: 'continuum', race: 'medtronic' };
    var h = location.hash.slice(1);
    if (work[h]) { location.replace('../work/' + location.search + '#' + work[h]); return; }
    var hash = h ? '#' + (map[h] || h) : '';
    location.replace('../projects/' + location.search + hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=../projects/">
<link rel="canonical" href="https://iansabia.github.io/projects/">
<meta name="robots" content="noindex">
<style>html{background:#F6F1E6;color:#0B0817}html[data-theme="dark"]{background:#0B0817;color:#EFEAF8}
body{margin:0;font:500 17px/1.45 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}p{padding:24px 16px}a{color:inherit}</style>
</head>
<body>
<noscript><p>The demos now live on the <a href="../projects/">Projects page</a>.</p></noscript>
</body>
