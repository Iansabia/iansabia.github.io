<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ian's Room</title>
<meta name="description" content="Replay the intro to Ian Sabia's site: down a brownstone street, in the front door, and onto the monitor in his room.">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0817'/%3E%3Cpath d='M12 50 C 22 8, 44 6, 52 30' stroke='%239B85FF' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='52' cy='30' r='6' fill='%23e08a55'/%3E%3C/svg%3E">
<link rel="stylesheet" href="intro.css">
<style>
  :root { color-scheme: light; --bg: #F6F1E6; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1C1B21; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  #page { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .replay {
    position: fixed; z-index: 10; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
    appearance: none; margin: 0; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(29, 24, 48, .09); background: rgba(255, 253, 250, .74);
    -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .06);
    color: #1D1830; font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Inter", sans-serif;
  }
  :root[data-theme="dark"] .replay { border-color: rgba(182, 166, 204, .22); background: rgba(25, 19, 51, .74); color: #F4F0FA; }
  .replay[hidden] { display: none; }
</style>
<script>window.__INTRO_MANUAL = true;</script>
</head>
<body>
<iframe id="page" src="../?nointro" title="Ian Sabia"></iframe>
<button class="replay" id="replay" type="button" hidden>Replay intro</button>
<script type="module">
  import { playIntro } from './intro.js';
  const page = document.getElementById('page'), btn = document.getElementById('replay');
  const ok = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  // the page inside the frame keeps the theme in step if its toggle is used
  const sync = () => { try { const d = page.contentDocument.documentElement.dataset.theme; if (d) document.documentElement.dataset.theme = d; } catch (e) {} };
  const go = async () => {
    btn.hidden = true;
    try { page.contentWindow.scrollTo(0, 0); } catch (e) {}
    if (ok) await playIntro({ force: true, target: page });
    btn.hidden = false;
  };
  page.addEventListener('load', () => {
    sync();
    try { new MutationObserver(sync).observe(page.contentDocument.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
    go();
  }, { once: true });
  btn.addEventListener('click', go);
</script>
</body>
</html>
